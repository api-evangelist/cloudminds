apis:
- aid: cloudminds:harix-robot-skill-api
  name: HARIX Robot Skill API (gRPC)
  description: 'The gRPC surface a HARIX skill application uses to drive a CloudMinds cloud robot and to
    consume HARIX cloud AI. Five robotSkillApi services cover control (move/rotate/stop/emergency-stop,
    RCU reboot/shutdown, intent + action dispatch), navigation (maps, locations, patrol routes, charging
    pile attach/detach), configuration, text-to-speech and operator hand-off; robotmind covers skill
    registration and action dispatch; skill.asr, skill.vision and skill.nlu cover speech recognition
    (unary + bidirectional streaming), thirteen vision detectors and intent detection; and the serviceapp
    package defines the callback services a skill app implements to receive recognition results and vision
    events pushed back from HARIX. No base URL is published — the SDK takes the gRPC target as a caller
    supplied parameter bound per robot deployment.'
  humanURL: https://harix.dataarobotics.com/#/index/community/home
  tags:
