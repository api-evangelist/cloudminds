name: CloudMinds
description: 'CloudMinds — now operating as Dataa Robotics (达闼机器人股份有限公司) — is a cloud-robotics
  company founded in 2015, originally with dual headquarters in Beijing, China and Santa Clara/Irvine,
  California, and backed by SoftBank and Foxconn. It builds cloud-connected smart machines and the HARIX
  ("Human Augmented Robot Intelligence with eXtreme reality") cloud AI robot brain, operating cloud robots
  over its robot secure private network and a digital-twin simulation layer. Its developer offering is the
  HARIX Robot Development Kit (RDK) — an app behavior blueprint editor, motion/dance editor, scene-map
  tools, and a robot simulation/training platform — distributed through the HARIX RDK portal, the HarixRDK
  GitHub organization, and the official "harix" Python SDK on PyPI. CloudMinds publishes no OpenAPI and no
  public REST API; its machine-readable contract is gRPC/protobuf3 — 14 services and 88 RPCs across robot
  control, navigation, configuration, TTS, skill dispatch, speech recognition, vision recognition and NLU —
  shipped as compiled descriptors inside the first-party Python SDK. The US-facing cloudminds.com domain no
  longer answers; the live corporate surface is dataarobotics.com. Added to the U.S. BIS Entity List in May
  2020.'
