    name: HARIX protobuf data model
  x-base-url: null
  x-base-url-note: >-
    No base URL is published. The first-party SDK constructs every stub with
    grpc.insecure_channel(grpc_url, options=[('grpc.default_authority', authority)]) where grpc_url and
    authority are supplied by the integrator, so the endpoint is per-deployment and CloudMinds documents
    no default host. Recorded as missing rather than guessed.
