name: CloudMinds
description: 'CloudMinds (Dataa Robotics / 达闼科技) is a cloud-robotics company founded in 2015 with
  dual headquarters in Beijing, China and Irvine, California, backed by SoftBank and Foxconn. It builds
  cloud-connected smart machines and the HARIX ("Human Augmented Robot Intelligence with eXtreme reality")
  cloud AI robot brain, operating cloud robots over its Mobile-intranet Cloud Services (MCS) and Virtual
  Backbone Network (VBN). Its developer offering is the HARIX Robot Development Kit (RDK) — an app behavior
  blueprint editor, motion/dance editor, scene-map tools, and a robot simulation/training platform —
  distributed through the HARIX RDK portal, the HarixRDK GitHub organization, and the official "harix"
  Python SDK on PyPI. CloudMinds does not publish a public REST API; it exposes flexible APIs and
  middleware to integrate robots with legacy systems. Added to the U.S. BIS Entity List in May 2020.'
